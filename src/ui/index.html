<!doctype html>
<html lang="en" data-view="panel" data-layout="stacked">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mobile Dev</title>
  <!-- APP_STYLE -->
</head>
<body>
  <main>
    <nav class="workspace-toolbar" aria-label="Developer tools">
      <div class="tool-switcher">
        <button id="tool-logs" class="tool-tab cursor-interaction" aria-current="page" aria-controls="logs-drawer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 8 4 4-4 4M12 16h8"/></svg>Logs</button>
      </div>
    </nav>
    <div id="workspace-panels">
    <section id="simulator-panel" aria-label="Simulator">
    <header class="simulator-heading">
      <div class="toolbar" aria-label="Simulator controls">
        <div class="device-picker">
          <label class="sr-only" for="devices">Simulator</label>
          <select id="devices" class="cursor-interaction" disabled><option>Loading simulators…</option></select>
          <svg class="chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m6 8 4 4 4-4"/></svg>
        </div>
        <span id="frame-stats" aria-hidden="true">0 fps</span>
        <span class="format" aria-hidden="true">MJPEG</span>
        <button id="start" class="start-button cursor-interaction" disabled>Start</button>
        <span class="divider" aria-hidden="true"></span>
        <button class="icon-button cursor-interaction" data-button="home" title="Home" aria-label="Home" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v11h5v-7h4v7h5V9"/></svg></button>
        <button class="icon-button cursor-interaction" data-button="power" title="Lock" aria-label="Lock" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></button>
        <button class="icon-button cursor-interaction" data-button="app-switcher" title="App Switcher" aria-label="App Switcher" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="13" height="14" rx="3"/><path d="M8 7V5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-3"/></svg></button>
        <button id="refresh" class="icon-button cursor-interaction" title="Refresh simulators" aria-label="Refresh simulators"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6 6a8 8 0 0 1 13 3M18 18A8 8 0 0 1 5 15"/></svg></button>
      </div>
      <p id="notice" role="status" hidden><span id="notice-message"></span> <button id="repair-input" class="cursor-interaction" title="Restarts SpringBoard and closes running simulator apps" hidden>Repair input</button></p>
      <p id="stream-timings" aria-live="off"></p>
    </header>
    <section id="stage" aria-label="Live simulator screen">
      <p id="empty" role="status">Loading simulators…</p>
      <div id="device-frame" hidden>
        <img id="device-bezel" alt="" draggable="false" hidden>
        <canvas id="screen" tabindex="0" aria-label="Simulator screen. Click or drag to interact. Focus to type."></canvas>
      </div>
    </section>
    </section>
    <section id="logs-drawer" aria-label="App logs">
      <div class="logs-heading">
        <button id="logs-toggle" class="logs-toggle cursor-interaction" aria-expanded="false" aria-controls="logs-body"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 8 4 4-4 4M12 16h8"/></svg><span>Logs</span><span id="logs-count" class="log-count">0</span><svg class="logs-caret" viewBox="0 0 20 20" aria-hidden="true"><path d="m6 12 4-4 4 4"/></svg></button>
        <span id="logs-status" role="status">Closed</span>
        <button id="logs-remove-attachment" class="log-action cursor-interaction" hidden>Remove attachment</button>
        <button id="logs-pause" class="log-action cursor-interaction" hidden>Pause</button>
        <button id="logs-clear" class="log-action cursor-interaction" hidden>Clear</button>
        <button id="logs-settings-toggle" class="log-action cursor-interaction" aria-expanded="false" aria-controls="logs-settings" hidden>Sources</button>
      </div>
      <div id="logs-body" hidden>
        <div id="logs-settings" hidden>
          <label>Native source<select id="logs-native" class="cursor-interaction"><option value="ios">Selected simulator</option><option value="none">None</option></select></label>
          <label>App filter<input id="logs-process" placeholder="Executable name or Android package" maxlength="256" title="Leave empty to read all device processes"></label>
          <label>Metro URL<input id="logs-metro-url" type="url" value="http://127.0.0.1:8081" maxlength="2048" spellcheck="false"></label>
          <button id="logs-discover" class="log-action cursor-interaction">Find sources</button>
          <label>Metro app<select id="logs-metro-target" class="cursor-interaction"><option value="">None</option></select></label>
          <button id="logs-apply" class="log-action cursor-interaction">Connect</button>
          <p id="logs-source-notice" role="status"></p>
        </div>
        <div class="logs-toolbar" aria-label="Log filters">
          <div class="log-filter-group" aria-label="Sources">
            <button class="log-filter cursor-interaction" data-log-source="js" aria-pressed="true"><span aria-hidden="true">&lt;/&gt;</span> JS</button>
            <button class="log-filter cursor-interaction" data-log-source="native" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg> Native</button>
          </div>
          <div class="log-filter-group" aria-label="Levels">
            <button class="log-filter cursor-interaction" data-log-level="info" aria-pressed="true">Info</button>
            <button class="log-filter cursor-interaction" data-log-level="warn" aria-pressed="true">Warn</button>
            <button class="log-filter cursor-interaction" data-log-level="error" aria-pressed="true">Error</button>
            <button class="log-filter cursor-interaction" data-log-level="debug" aria-pressed="true">Debug</button>
          </div>
          <label class="log-search"><span class="sr-only">Search logs</span><input id="logs-search" type="search" placeholder="Search logs…" maxlength="512"></label>
          <button id="logs-stack" class="log-filter cursor-interaction" aria-pressed="true" title="Group identical logs">Stack</button>
          <button id="logs-follow" class="log-filter cursor-interaction" aria-pressed="true" title="Follow new logs">Follow</button>
        </div>
        <div id="logs-error" role="status" hidden></div>
        <div class="logs-content">
          <div id="logs-list" aria-label="Log entries"><p class="logs-empty">Start a simulator to read its logs, or choose a source.</p></div>
          <aside id="log-detail" aria-label="Selected log" hidden>
            <div class="log-detail-heading"><span id="log-detail-label"></span><button id="log-attach" class="log-action cursor-interaction">Attach to chat</button><button id="log-detail-close" class="log-action cursor-interaction" aria-label="Close log details">Close</button></div>
            <p id="log-attach-status" role="status"></p>
            <pre id="log-detail-message"></pre>
          </aside>
        </div>
        <div id="logs-footer"></div>
      </div>
    </section>
    </div>
  </main>
  <!-- APP_SCRIPT -->
</body>
</html>
