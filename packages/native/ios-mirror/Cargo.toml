[package]
name = "mobile-dev-ios-mirror"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
mobile-dev-telemetry.workspace = true
mobile-dev-device-tunnel.workspace = true
idevice = { workspace = true, features = ["ring", "usbmuxd", "core_device_proxy", "tunnel_tcp_stack", "display_stream"] }
napi = { version = "3", default-features = false, features = ["napi8", "tokio_rt"] }
napi-derive = "3"
plist.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros", "time"] }
uuid = { version = "1", features = ["v4"] }
flate2 = "1"
thiserror = "2"
web-time = "1"

[build-dependencies]
napi-build = "2"
