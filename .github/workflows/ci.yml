name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The weekly dependency update starts CI on its pull request this way.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  HUSKY: '0'

jobs:
  unit:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Unit tests
          - os: windows-latest
            name: Windows Android and package
          - os: macos-latest
            name: macOS Android and launcher
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/runtimes/agent-device/package-lock.json
            packages/runtimes/e2e/package-lock.json
            packages/runtimes/serve-emu/package-lock.json

      - name: Install dependencies and device runtimes
        run: |
          npm ci --no-audit --no-fund
          npm run vendor:agent-device
          npm run vendor:e2e
          npm run vendor:serve-emu

      # The release workflow also runs the full suite on a Mac with Xcode and native helpers.
      - if: runner.os == 'Linux'
        run: npm test
      - if: runner.os != 'Linux'
        name: Android, source analysis, and launcher regressions
        run: >
          node --test
          apps/codex-plugin/test/mcp-launch.test.ts apps/codex-plugin/test/plugin-updates.test.ts
          packages/core/test/agent-device-runtime.test.ts
          packages/core/test/android-sdk.test.ts packages/core/test/android.test.ts packages/core/test/android-emulator.test.ts
          packages/core/test/app-storage.test.ts packages/core/test/testing-run.test.ts packages/core/test/windows-adb-trace.test.ts
          packages/core/test/app-flow-presentations-bindings.test.ts packages/core/test/app-flow-typescript-runtime.test.ts
          packages/runtimes/test/serve-emu-node.test.ts packages/ui/test/simulator-panel.test.ts packages/ui/test/testing-panel.test.ts
      - if: runner.os == 'Windows'
        run: npm run build
      - if: runner.os == 'Windows'
        run: npm run package
      - if: runner.os == 'Windows'
        run: npm run test:package
        env:
          MOBILE_DEV_TELEMETRY: 'off'
      - run: npm run typecheck:telemetry

  # Codex and Claude ship from main. Add mac here once it ships.
  hosts:
    name: Regression (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [codex, claude]
    container:
      # Keep in step with @playwright/test in package.json.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - run: npm ci --no-audit --no-fund
      - run: npm run build:hosts -- ${{ matrix.target }}
      - run: npx playwright test -c tooling/hosts --project ${{ matrix.target }} --grep-invert @visual

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: regression-${{ matrix.target }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  visual:
    name: Visual regression (codex)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - run: npm ci --no-audit --no-fund
      - run: npm run build:hosts -- codex
      - run: npx playwright test -c tooling/hosts --project codex --grep @visual

      # The report shows expected, actual and diff images for each changed screenshot.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-regression
          path: |
            playwright-report
            test-results
          retention-days: 7

  visual-report:
    name: Visual diff comment
    needs: visual
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        continue-on-error: true
        with:
          name: visual-regression
          path: visual-regression

      - name: Find the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: echo "number=${NUMBER:-$(gh pr list -R "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number -q '.[0].number')}" >> "$GITHUB_OUTPUT"

      - name: Comment the screenshot diffs
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VISUAL_RESULT: ${{ needs.visual.result }}
        run: node tooling/hosts/report-diffs.mjs visual-regression
